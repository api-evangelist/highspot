aid: highspot
name: Highspot
description: >-
  Highspot is a sales enablement and go-to-market platform whose API surface splits in
  two. A per-tenant REST API at https://api-{instance}.highspot.com/v1.0 covers spots,
  items, item content, users, groups, pitches and analytics, authenticated with an API
  client key and secret issued from account settings; it has no public reference and no
  published OpenAPI. Alongside it Highspot runs a first-party remote MCP server at
  https://mcp.highspot.com/mcp, verified live, secured with OAuth 2.1 (dynamic client
  registration, PKCE, scopes mcp:read / mcp:write / offline_access) and discoverable
  through RFC 8414 and RFC 9728 metadata documents. The MCP server exposes content
  search, instant answers, deal context, content recommendations, linked pitches,
  Digital Room generation and Highspot Agents to OpenAI, Anthropic and Microsoft
  Copilot clients. Both the MCP server and the Insights Layer APIs are gated to the
  top "Best" subscription tier.
