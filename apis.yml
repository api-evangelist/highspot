  reason: mcp-surface-verified
  detail: >-
    The REST API reference is gated — developers.highspot.com 302s to
    https://app.highspot.com/unsupported_browser and api-su2.highspot.com/v1.0/ returns
    401 — but contract discovery found a live first-party remote MCP server at
    https://mcp.highspot.com/mcp with full OAuth 2.1 discovery metadata, so this
    profile is covered on the agent surface even though no OpenAPI is published.
  evidence:
    - url: https://mcp.highspot.com/mcp
      status: 401
    - url: https://mcp.highspot.com/.well-known/oauth-protected-resource/mcp
      status: 200
    - url: https://app.highspot.com/.well-known/oauth-authorization-server
      status: 200
    - url: https://developers.highspot.com/
      status: 302
    - url: https://api-su2.highspot.com/openapi.json
      status: 404
  checked: '2026-08-14'
