name: Highspot Client Packages
description: 'Registry sweep for Highspot API client libraries. Highspot publishes NO first-party SDK in any package registry — npm, PyPI, RubyGems,
  NuGet, Maven Central, crates.io and the Go module proxy all return zero Highspot-authored packages, and the github.com/highspot organization
  contains only forks of unrelated open-source projects (testcafe, flutter plugins, aws-sdk-ruby) with no Highspot API client. Two community packages
  exist and both are recorded below with their real currency, because their release dates are the only dated evidence available about how the
  integration ecosystem is aging. The Python SDK on readthedocs.io that apis.yml previously listed as a Highspot SDK is one of them: it is third-party,
  authored by Jeff Shurtliff, and last released in December 2022.'
