findings:
- Highspot ships a remote MCP server but no client package of any kind — there is nothing to npm install, pip install, or import. Every integration
  path is either raw HTTP against api-{instance}.highspot.com or a third-party iPaaS connector (Workato, Glean, Smartsheet, Microsoft Power Platform).
- No SDKs pointer is emitted in apis.yml, because official_sdk_count is 0. Both packages here are community work.
