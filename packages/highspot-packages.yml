  - registry: packagist
    query: highspot
    results: null
    official: 0
    note: packagist.org returned HTTP 502 at probe time; not re-checked
  - registry: github
    query: orgs/highspot repos
    results: 48
    official: 0
    note: >-
      All 48 repositories are forks of unrelated open-source projects. No Highspot API
      client, no MCP server package, no SDK.

findings:
  - >-
    Highspot ships a remote MCP server but no client package of any kind — there is
    nothing to npm install, pip install, or import. Every integration path is either
    raw HTTP against api-{instance}.highspot.com or a third-party iPaaS connector
    (Workato, Glean, Smartsheet, Microsoft Power Platform).
  - >-
    No SDKs pointer is emitted in apis.yml, because official_sdk_count is 0. Both
    packages here are community work.
