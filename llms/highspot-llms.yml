name: Highspot llms.txt
description: >-
  Highspot serves an llms.txt at the root of its marketing site. It is generated by
  Yoast SEO v28.2 and is a content index — pages, blog posts, authors, case studies,
  company tags and guides — not a developer or API index. It names no API, no
  endpoint, no MCP server and no documentation URL, so an agent that reads it learns
  what Highspot sells and nothing about how to call it. Saved verbatim.
